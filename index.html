<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3a8a">
<meta name="description" content="Apprendre la physique-chimie en jouant : relations, unités, définitions et conclusions du cours (Tronc commun, 1re et 2e Bac).">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Familles de la physique – TC, 1re et 2e Bac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf3; --grid:rgba(66,133,200,.13); --grid2:rgba(66,133,200,.24);
  --ink:#1d3a8a; --ink-soft:#3b5bb5; --text:#1b2440; --muted:#5a6483;
  --red:#c62828; --red-soft:#fde7e7; --green:#1b7f3b; --green-soft:#e3f6e8;
  --hl-yellow:rgba(255,226,64,.65); --hl-green:rgba(120,230,120,.45); --hl-pink:rgba(255,140,190,.4);
  --t-g:#1d4ed8; --t-s:#7c3aed; --t-u:#0f766e; --t-r:#c2410c;
  --card:#fffef9; --shadow:0 2px 0 rgba(29,58,138,.12), 0 6px 18px rgba(29,58,138,.08);
  --radius:14px;
  --f-text:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-hand:'Kalam', 'Comic Sans MS', cursive;
  --f-math:'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--text); font-family:var(--f-text); font-size:17px; line-height:1.5;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid2) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid2) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:50px 50px,50px 50px,10px 10px,10px 10px;
  min-height:100vh;
}
button{font:inherit; color:inherit}
a{color:var(--ink)}
:focus-visible{outline:3px solid #f59e0b; outline-offset:2px; border-radius:8px}
.m{font-family:var(--f-math); font-size:1.08em; white-space:normal}
sub,sup{font-size:.68em; line-height:0}
.vec{position:relative; display:inline-block; padding-top:.18em}
.vec::before{content:'→'; position:absolute; left:50%; top:-.62em; transform:translateX(-50%) scaleX(1.25); font-size:.62em; line-height:1}
.bar{text-decoration:overline; text-decoration-thickness:1.5px}
.nuc{display:inline-flex; flex-direction:column; align-items:flex-end; vertical-align:-.45em; line-height:1; margin-right:.05em}
.nuc sup,.nuc sub{font-size:.62em; line-height:1.05; position:static}

/* ---------- barre du haut ---------- */
.top{position:sticky; top:0; z-index:20; background:rgba(251,250,243,.94); backdrop-filter:blur(6px);
  border-bottom:2px solid var(--ink); display:flex; align-items:center; gap:8px; padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top))}
.top .back{border:2px solid var(--ink); background:#fff; border-radius:12px; min-width:44px; height:44px; font-size:20px; cursor:pointer; color:var(--ink)}
.top .ttl{flex:1; min-width:0; font-family:var(--f-hand); font-weight:700; color:var(--ink); font-size:20px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); background:#fff; border-radius:999px; padding:4px 10px; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer; min-height:40px}
.chip .fl{color:#e65100}
main{max-width:980px; margin:0 auto; padding:16px 14px 90px}
h1,h2,h3{font-family:var(--f-hand); color:var(--ink); line-height:1.15; margin:.2em 0 .4em}
h1{font-size:34px} h2{font-size:26px} h3{font-size:21px}
.lead{color:var(--muted); margin:.2em 0 1em}
.hl{background:linear-gradient(transparent 35%, var(--hl-yellow) 35%, var(--hl-yellow) 90%, transparent 90%); padding:0 .15em}
.sheet{background:var(--card); border:2px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px}
.sheet + .sheet{margin-top:14px}
.margin-line{border-left:3px solid rgba(198,40,40,.55); padding-left:12px}

/* ---------- boutons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 18px;
  border-radius:12px; border:2px solid var(--ink); background:var(--ink); color:#fff; font-weight:700; cursor:pointer; text-decoration:none; box-shadow:0 3px 0 #10245c; transition:transform .1s}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #10245c}
.btn.ghost{background:#fff; color:var(--ink); box-shadow:0 3px 0 rgba(29,58,138,.35)}
.btn.red{background:var(--red); border-color:var(--red); box-shadow:0 3px 0 #7f1414}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* ---------- accueil ---------- */
.hero{text-align:center; padding:10px 4px 6px}
.hero h1{font-size:40px; margin-bottom:0}
.hero .sub{font-family:var(--f-hand); font-size:20px; color:var(--red); transform:rotate(-1.5deg); display:inline-block}
.levels{display:grid; gap:14px; margin-top:18px}
.level{display:flex; gap:14px; align-items:center; text-align:left; width:100%; cursor:pointer; padding:16px; border:2px solid var(--ink); background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow)}
.level .big{font-family:var(--f-hand); font-size:30px; color:#fff; background:var(--ink); border-radius:12px; min-width:64px; height:64px; display:grid; place-items:center}
.level.off{opacity:.55; cursor:not-allowed}
.level .nm{font-weight:700; font-size:19px; color:var(--ink)}
.level .ds{color:var(--muted); font-size:15px}
.statsline{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px}
.pill{background:#fff; border:1.5px dashed var(--ink-soft); border-radius:999px; padding:4px 12px; font-size:14px; color:var(--ink)}

/* ---------- carte des chapitres ---------- */
.dom{margin:22px 0 8px; display:flex; align-items:baseline; gap:10px}
.dom h2{margin:0}
.dom .tag{font-size:14px; color:var(--muted)}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px}
.tile{position:relative; text-align:left; cursor:pointer; background:var(--card); border:2px solid var(--ink); border-radius:var(--radius); padding:12px 12px 10px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; min-height:156px; transition:transform .15s}
.tile:hover{transform:translateY(-2px) rotate(-.3deg)}
.tile .ic{font-size:26px; line-height:1}
.tile .no{font-family:var(--f-hand); color:var(--red); font-size:15px}
.tile .tt{overflow-wrap:anywhere; hyphens:auto; -webkit-hyphens:auto; font-weight:700; font-size:15px; line-height:1.25; color:var(--ink); flex:1}
.stars{letter-spacing:2px; font-size:18px; color:#d0d5e4}
.stars .on{color:#f5b301; text-shadow:0 1px 0 #b07d00}
.bar-m{height:9px; border-radius:9px; background:#e7eaf3; border:1px solid #c7cde0; overflow:hidden}
.bar-m > i{display:block; height:100%; background:linear-gradient(90deg,#4f7cf0,#22a06b)}
.tile.chim .ic{filter:hue-rotate(90deg)}

/* ---------- page chapitre ---------- */
.chhead{display:flex; gap:12px; align-items:center}
.chhead .ic{font-size:40px}
.acts{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:12px}
.act{display:flex; gap:12px; align-items:center; width:100%; text-align:left; cursor:pointer; background:var(--card); border:2px solid var(--ink); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow)}
.act .em{font-size:28px; width:52px; height:52px; display:grid; place-items:center; border-radius:12px; background:#eef2ff; flex:none}
.act .nm{font-weight:700; color:var(--ink)}
.act .ds{font-size:14px; color:var(--muted)}
.act .ok{margin-left:auto; color:var(--green); font-weight:700; font-size:22px}
.act.fiche .em{background:#fff7d6}
.act.classe .em{background:#ffe4e6}
.note-red{font-family:var(--f-hand); color:var(--red); font-size:18px; transform:rotate(-1deg); display:inline-block}

/* ---------- jeu des familles ---------- */
.legend{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px}
.legend span{font-size:13px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff}
.tg{background:var(--t-g)} .ts{background:var(--t-s)} .tu{background:var(--t-u)} .tr{background:var(--t-r)}
.zone{margin:10px 0 4px}
.zone .zl{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px}
.cards{display:grid; gap:8px}
.cards.k-g, .cards.k-r{grid-template-columns:repeat(2, minmax(0,1fr))}
.cards.k-s, .cards.k-u{grid-template-columns:repeat(4, minmax(0,1fr))}
.cards.long{grid-template-columns:repeat(2, minmax(0,1fr))}
.fc{overflow-wrap:anywhere; position:relative; min-height:56px; padding:8px 6px; border-radius:12px; background:#fff; border:2px solid; cursor:pointer; text-align:center; font-weight:700; line-height:1.25; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 rgba(0,0,0,.08); transition:transform .12s, background .12s}
.fc.g{border-color:var(--t-g); color:#16337f; font-size:15px}
.fc.s{border-color:var(--t-s); color:#4c1d95; font-size:20px}
.fc.u{border-color:var(--t-u); color:#0b4f4a; font-size:16px}
.fc.r{border-color:var(--t-r); color:#7a2a07; font-size:16px}
.fc.alt{font-size:15px}
.fc.sel{transform:translateY(-3px); box-shadow:0 0 0 3px #fff, 0 0 0 6px currentColor}
.fc.g.sel{background:#e8eeff} .fc.s.sel{background:#f1eaff} .fc.u.sel{background:#e2f6f3} .fc.r.sel{background:#fff0e6}
.fc.bad{background:var(--red-soft)!important; border-color:var(--red)!important; animation:shake .35s}
.fc.bad::after{content:'✗'; position:absolute; top:-10px; right:-6px; background:var(--red); color:#fff; border-radius:50%; width:22px; height:22px; font-size:14px; display:grid; place-items:center}
.fc.gone{display:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.found{display:grid; gap:8px; margin-top:12px}
.fam{background:#fff; border:2px solid var(--ink); border-radius:12px; padding:10px 12px; animation:pop .35s}
.fam .line{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline}
.fam .line b{background:linear-gradient(transparent 40%, var(--hl-green) 40%, var(--hl-green) 92%, transparent 92%)}
.fam .ex{font-size:15px; color:var(--muted); margin-top:4px}
@keyframes pop{from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1}}
.msg{min-height:28px; margin:10px 0; font-weight:700}
.msg.bad{color:var(--red); font-family:var(--f-hand); font-size:19px}
.msg.good{color:var(--green); font-family:var(--f-hand); font-size:19px}
.progress-dots{display:flex; gap:6px}
.progress-dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); display:block}
.progress-dots i.on{background:var(--ink)}

/* ---------- définitions ---------- */
.terms{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px}
.term{border:2px solid var(--t-g); color:#16337f; background:#fff; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer; min-height:44px}
.term.sel{background:var(--t-g); color:#fff}
.term.done{background:var(--hl-green); border-color:var(--green); color:#14532d; cursor:default}
.defs{display:grid; gap:10px}
.def{text-align:left; background:#fff; border:2px solid #9aa6c9; border-radius:12px; padding:12px 14px; cursor:pointer; min-height:48px; line-height:1.4}
.def.done{background:#f3fbf4; border-color:var(--green); cursor:default}
.def.done .tag{display:inline-block; font-weight:700; color:#14532d; background:var(--hl-green); padding:0 .3em; margin-bottom:4px}
.def.bad{border-color:var(--red); background:var(--red-soft); animation:shake .35s}

/* ---------- questions ---------- */
.qhead{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap}
.qcat{font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; background:#eef2ff; color:var(--ink)}
.qnum{font-family:var(--f-hand); color:var(--red); font-size:18px}
.qtext{font-size:19px; font-weight:700; color:var(--text); margin:6px 0 14px}
.qtext .stmt{display:block; font-weight:400; font-style:italic; background:#fff; border-left:4px solid var(--ink); padding:8px 12px; margin-top:8px; border-radius:6px}
.blank{display:inline-block; min-width:90px; border-bottom:2px dashed var(--ink); color:var(--ink)}
.opts{display:grid; gap:10px}
.opt{text-align:left; width:100%; background:#fff; border:2px solid var(--ink-soft); border-radius:12px; padding:12px 14px; cursor:pointer; min-height:52px; line-height:1.35; font-size:17px}
.opt:hover{background:#f4f6ff}
.opt.ok{border-color:var(--green); background:var(--green-soft)}
.opt.ko{border-color:var(--red); background:var(--red-soft); text-decoration:line-through; text-decoration-color:var(--red)}
.opt[disabled]{cursor:default}
.opts.vf{grid-template-columns:1fr 1fr}
.opts.vf .opt{text-align:center; font-weight:700; font-size:20px}
.corr{margin-top:14px; padding:12px 14px; border-radius:12px; border:2px dashed var(--red); background:#fff; animation:pop .3s}
.corr .h{font-family:var(--f-hand); font-size:20px; color:var(--red)}
.corr.good{border-color:var(--green)} .corr.good .h{color:var(--green)}
.corr .truth{background:linear-gradient(transparent 30%, var(--hl-yellow) 30%, var(--hl-yellow) 92%, transparent 92%)}
.corr .trap{text-decoration:line-through; text-decoration-color:var(--red); color:var(--muted)}
.pbar{height:10px; border-radius:10px; background:#e7eaf3; overflow:hidden; border:1px solid #c7cde0; flex:1; min-width:120px}
.pbar i{display:block; height:100%; background:var(--ink); transition:width .3s}

/* ---------- résultats ---------- */
.result{text-align:center}
.result .score{font-family:var(--f-hand); font-size:56px; color:var(--red); line-height:1}
.result .bigstars{font-size:40px; letter-spacing:6px}
.errs{text-align:left; display:grid; gap:10px; margin-top:12px}
.err{background:#fff; border:2px solid #f3b4b4; border-radius:12px; padding:10px 12px}
.err .q{font-weight:700}
.err .your{color:var(--red); text-decoration:line-through}
.err .good{color:var(--green); font-weight:700}

/* ---------- fiche ---------- */
.fiche h2{border-bottom:2px solid var(--ink); padding-bottom:4px; margin-top:22px}
.ftab{display:grid; gap:10px}
.frow{background:#fff; border:1.5px solid #c3cbe3; border-radius:12px; padding:10px 12px}
.frow .top2{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline}
.frow .nm{font-weight:700; color:var(--t-g)}
.frow .sy{color:var(--t-s); font-size:19px}
.frow .un{color:var(--t-u); font-weight:700}
.frow .re{color:var(--t-r); font-size:18px; font-weight:600}
.frow .ex{color:var(--muted); font-size:15px; margin-top:2px}
dl.fdefs{margin:0} dl.fdefs dt{font-weight:700; color:var(--ink); margin-top:10px} dl.fdefs dd{margin:2px 0 0 0; padding-left:12px; border-left:3px solid var(--hl-yellow)}
ul.fconc{padding-left:0; list-style:none; margin:0} ul.fconc li{padding:6px 0 6px 30px; position:relative; border-bottom:1px dashed #c7cde0}
ul.fconc li::before{content:'✔'; position:absolute; left:4px; color:var(--green); font-weight:700}
.trapbox{margin-top:18px; border:2.5px solid var(--red); border-radius:14px; padding:12px 14px; background:#fff; position:relative}
.trapbox .h{font-family:var(--f-hand); color:var(--red); font-size:22px; font-weight:700}
.readbtn{margin-top:22px; text-align:center}

/* ---------- mode classe ---------- */
.classe{font-size:22px}
.classe .teams{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.team{border:3px solid var(--ink); border-radius:16px; background:#fff; padding:10px; text-align:center}
.team.turn{background:#fff7d6; box-shadow:0 0 0 4px #f5b301}
.team .nm{font-family:var(--f-hand); font-size:26px; color:var(--ink)}
.team .sc{font-size:54px; font-weight:700; color:var(--red); line-height:1}
.timer{font-family:var(--f-hand); font-size:44px; color:var(--ink); text-align:center}
.timer.low{color:var(--red)}
.classe .qtext{font-size:30px}
.classe .opt{font-size:26px; min-height:72px}
.classe .opts.vf .opt{font-size:32px}
.classe label{display:block; font-weight:700; margin:10px 0 4px}
.classe input, .classe select{font:inherit; font-size:20px; padding:8px 10px; border:2px solid var(--ink); border-radius:10px; width:100%; max-width:380px; background:#fff}

/* ---------- profil / badges ---------- */
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.badge{background:#fff; border:2px solid var(--ink); border-radius:14px; padding:12px; text-align:center}
.badge .bi{font-size:34px}
.badge .bn{font-weight:700; color:var(--ink)}
.badge .bd{font-size:13px; color:var(--muted)}
.badge.locked{opacity:.45; filter:grayscale(1); border-style:dashed}
.xpbar{height:14px; border-radius:14px; background:#e7eaf3; overflow:hidden; border:1.5px solid var(--ink)}
.xpbar i{display:block; height:100%; background:linear-gradient(90deg,#f5b301,#e65100)}

/* ---------- toasts ---------- */
.toasts{position:fixed; right:10px; top:70px; z-index:50; display:grid; gap:6px; justify-items:end; max-width:min(80vw,340px); pointer-events:none}
.toast{background:var(--ink); color:#fff; border-radius:999px; padding:5px 12px; font-weight:700; font-size:14px; box-shadow:0 4px 12px rgba(0,0,0,.2); animation:pop .3s}
.toast.badge-t{background:#7a4a00; border:2px solid #f5b301}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.small{font-size:14px; color:var(--muted)}

@media (min-width:700px){
  body{font-size:18px}
  .cards.k-g{grid-template-columns:repeat(4, minmax(0,1fr))}
  .cards.k-r{grid-template-columns:repeat(4, minmax(0,1fr))}
  .cards.long{grid-template-columns:repeat(4, minmax(0,1fr))}
  .levels{grid-template-columns:repeat(3,1fr)}
  .level{flex-direction:column; text-align:center}
}
.install{display:flex; align-items:center; gap:12px; margin-top:16px; background:#fff7d6}
.install .em{font-size:30px}
.install .tx{flex:1; min-width:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="app" tabindex="-1"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sr" id="live" aria-live="assertive"></div>

<script>
/* =====================================================================
   CONTENU DU COURS – modifiable par l’enseignant·e
   ---------------------------------------------------------------------
   NIVEAUX → chapitres. Pour chaque chapitre :
   - familles : { g: grandeur, s: symbole, u: unité, r: relation, e: phrase d’explication }
       (si "types" est donné, les 4 cartes g/s/u/r prennent ces noms, ex. Acide / Base…)
   - definitions : { t: terme, d: définition }
   - conclusions : { v: énoncé exact, f: version piège (fausse) }
       Astuce : si v et f ne diffèrent que par quelques mots, une « phrase à compléter »
       est créée automatiquement.
   - piege : texte de l’encadré « Piège fréquent » de la fiche.
   - renfort : chapitres dont on emprunte des familles si le chapitre en a moins de 4.
   Notation : X_i ou X_{abc} = indice, X^{2+} = exposant, vec{F} = vecteur,
   bar{OA} = valeur algébrique (trait au-dessus).
   ===================================================================== */
const NIVEAUX = [
  { id: "tc", nom: "Tronc commun", detail: "Tronc commun scientifique", chapitres: [
/* ===== PHYSIQUE – Tronc commun ===== */
{
  id: "tp1", domaine: "Physique", num: 1, icone: "🌍",
  titre: "Gravitation universelle",
  familles: [
    { g: "Force de gravitation universelle", s: "F_{A/B}", u: "N", r: "F_{A/B} = G·m_A·m_B/d²", e: "Les deux corps s’attirent avec des forces de même intensité ; d est la distance entre leurs centres." },

    if(s[i]==='^' && s[i+1]==='{'){ const [a,j]=group(i+2); if(s[j]==='_' && s[j+1]==='{'){ const [z,k]=group(j+2); out += '<span class="nuc"><sup>'+fm(a)+'</sup><sub>'+fm(z)+'</sub></span>'; i=k; continue; } }
    if((s[i]==='_'||s[i]==='^') && s[i+1]==='{'){ const tag = s[i]==='_'?'sub':'sup'; const [g,j]=group(i+2); out += '<'+tag+'>'+fm(g)+'</'+tag+'>'; i=j; continue; }
    if(s[i]==='_' && i+1<s.length && RUN.test(s[i+1])){ let j=i+1; while(j<s.length && RUN.test(s[j])) j++; out += '<sub>'+esc(s.slice(i+1,j))+'</sub>'; i=j; continue; }
    out += esc(s[i]); i++;
  }
  return out;
}

/* =====================================================================
   1. FORMER LES FAMILLES
   ===================================================================== */
let FG = null;
function famPool(ch){
  let pool = ch.familles.map(f=>Object.assign({src:ch.id}, f));
  (ch.renfort||[]).forEach(id=>{ const o=CH[id]; if(o && typesOf(o).join()===typesOf(ch).join()) o.familles.forEach(f=>{ if(!pool.some(x=>x.r===f.r)) pool.push(Object.assign({src:id}, f)); }); });
  return pool;
}
function newFamRound(ch){
  const chosen=[], names=new Set();
  const add = f => { if(chosen.length<4 && !names.has(f.g)){ chosen.push(f); names.add(f.g); } };
  shuffle(ch.familles.slice()).forEach(add);
  if(chosen.length<4) (ch.renfort||[]).forEach(id=>{ const o=CH[id]; if(o && typesOf(o).join()===typesOf(ch).join()) shuffle(o.familles.slice()).forEach(add); });
  const cards=[]; let id=0;
  chosen.forEach(f=>KEYS.forEach(k=>cards.push({id:id++, k, text:f[k], gone:false})));
  KEYS.forEach(k=>{ const part=shuffle(cards.filter(c=>c.k===k)); part.forEach((c,i)=>c.ord=i); });
  FG = {ch:ch.id, fams:chosen, left:chosen.slice(), cards, sel:{}, found:[], errors:0, msg:"", msgCls:"", bad:[]};
}
function vFam(){
  const ch=CH[view.ch]; if(!FG || FG.ch!==ch.id) newFamRound(ch);
  const T=typesOf(ch), cls={g:"tg",s:"ts",u:"tu",r:"tr"};
  const borrowed = FG.fams.filter(f=>!ch.familles.includes(f)).length;
  const longK = k => !isStd(ch) || FG.cards.filter(c=>c.k===k).some(c=>c.text.replace(/(vec|bar)\{|[{}_^]/g,'').length>7);
  let h = '<h2>🃏 Former les familles</h2><p class="lead" style="margin-top:0">Touche <b>une carte de chaque couleur</b> qui vont ensemble. Les cartes identiques sont interchangeables.</p>'+
    '<div class="legend">'+KEYS.map((k,i)=>'<span class="'+cls[k]+'">'+esc(T[i])+'</span>').join("")+'</div>'+
    (borrowed?'<p class="small">Ce chapitre a peu de familles : '+borrowed+' famille(s) viennent d’un chapitre voisin.</p>':'')+
    '<div class="row"><span class="small">Familles trouvées :</span><span class="progress-dots">'+FG.fams.map((f,i)=>'<i class="'+(i<FG.found.length?'on':'')+'"></i>').join("")+'</span><span class="spacer"></span><span class="small">Erreurs : '+FG.errors+'</span></div>';
  if(FG.left.length){
    h += '<div class="msg '+FG.msgCls+'" role="status">'+(FG.msg||'&nbsp;')+'</div>';
    h += KEYS.map((k,i)=>'<div class="zone"><div class="zl" style="color:var(--t-'+k+')">'+esc(T[i])+'</div><div class="cards k-'+k+(longK(k)?' long':'')+'">'+
      FG.cards.filter(c=>c.k===k).sort((a,b)=>a.ord-b.ord).map(c=>'<button class="fc '+k+(isStd(ch)?'':' alt')+(FG.sel[k]===c.id?' sel':'')+(FG.bad.includes(c.id)?' bad':'')+(c.gone?' gone':'')+'" data-a="card" data-id="'+c.id+'" '+(c.gone?'tabindex="-1" aria-hidden="true"':'aria-pressed="'+(FG.sel[k]===c.id)+'"')+'>'+(k==="g"?esc(c.text):M(c.text).replace(/−/g,"−<wbr>"))+'</button>').join("")+'</div></div>').join("");
  } else {
    const perfect = FG.errors===0;
    h += '<div class="sheet result" style="margin-top:14px"><div class="score">'+(perfect?'Parfait !':'Bravo !')+'</div><p>Tu as formé les 4 familles'+(FG.errors?' avec '+FG.errors+' erreur'+(FG.errors>1?'s':''):' sans aucune erreur')+'.</p>'+
      '<div class="row" style="justify-content:center"><button class="btn" data-a="famagain">🔄 Nouvelle partie</button><button class="btn ghost" data-a="tochap">Retour au chapitre</button></div></div>';
  }
  if(FG.found.length) h += '<h3 style="margin-top:16px">Familles trouvées</h3><div class="found">'+FG.found.slice().reverse().map(f=>famLine(f, T)).join("")+'</div>';
  return h;
}
function famLine(f, T){
  return '<div class="fam"><div class="line"><b>'+esc(f.g)+'</b><span>'+M(f.s)+'</span><span style="color:var(--t-u);font-weight:700">'+M(f.u)+'</span><span style="color:var(--t-r)">'+M(f.r)+'</span></div><div class="ex">'+fm(f.e)+'</div></div>';
}
function clickCard(id){
  const c = FG.cards[id]; if(!c || c.gone) return;
  FG.bad=[]; FG.msg=""; FG.msgCls="";
  FG.sel[c.k] = (FG.sel[c.k]===id) ? undefined : id;
  if(KEYS.every(k=>FG.sel[k]!==undefined)) checkFam();
  render();
}
function checkFam(){
  const ch=CH[FG.ch], T=typesOf(ch);
  const s = {}; KEYS.forEach(k=>s[k]=FG.cards[FG.sel[k]]);
  const hit = FG.left.find(f=>KEYS.every(k=>f[k]===s[k].text));
  if(hit){
    KEYS.forEach(k=>s[k].gone=true);
    FG.left.splice(FG.left.indexOf(hit),1); FG.found.push(hit); FG.sel={};
    P.st.fam++; P.st.unit++; answered(true);
    FG.msg = pick(GOOD)+" Famille complète."; FG.msgCls="good"; say(FG.msg);
    if(!FG.left.length){ const c=cs(FG.ch); const first=!c.fam; c.fam=true; addXP(first?40:15); }
  } else {
    FG.errors++; answered(false);
    // famille visée = celle de la carte de 1er type ; on signale les cartes qui ne vont pas, sans donner la bonne
    const cands = FG.left.filter(f=>f.g===s.g.text);
    let best=cands[0], bm=-1; cands.forEach(f=>{ const m=KEYS.filter(k=>f[k]===s[k].text).length; if(m>bm){bm=m; best=f;} });
    const wrong = KEYS.filter(k=>best[k]!==s[k].text);
    FG.bad = wrong.map(k=>s[k].id);
    const names = wrong.map(k=>T[KEYS.indexOf(k)].toLowerCase());
    FG.msg = (wrong.length===1 ? "La carte « "+names[0]+" » ne va pas avec" : "Les cartes "+names.map(n=>"« "+n+" »").join(" et ")+" ne vont pas avec")+" « "+esc(s.g.text)+" ». Cherche encore !";
    FG.msgCls="bad"; say(FG.msg.replace(/<[^>]+>/g,""));
    wrong.forEach(k=>FG.sel[k]=undefined);
  }
  save();
}

/* =====================================================================
   2. DÉFINITIONS
   ===================================================================== */
let DG = null;
function newDef(ch){
  const all = shuffle(ch.definitions.slice()); const groups=[];
  for(let i=0;i<all.length;i+=4) groups.push(all.slice(i,i+4));
  if(groups.length>1 && groups[groups.length-1].length===1){ groups[groups.length-1].unshift(groups[groups.length-2].pop()); }
  DG = {ch:ch.id, groups, gi:0, done:[], sel:null, order:null, errors:0, msg:"", msgCls:"", bad:null, total:all.length, ok:0};
  DG.order = shuffle(groups[0].slice());
}
function vDef(){
  const ch=CH[view.ch]; if(!DG || DG.ch!==ch.id) newDef(ch);
  const g = DG.groups[DG.gi];
  let h = '<h2>📖 Définitions</h2><p class="lead" style="margin-top:0">Touche un <b>terme</b>, puis la <b>définition</b> qui lui correspond.</p>'+
    '<div class="row"><span class="small">Série '+Math.min(DG.gi+1,DG.groups.length)+' / '+DG.groups.length+'</span><div class="pbar"><i style="width:'+Math.round(100*DG.ok/DG.total)+'%"></i></div><span class="small">Erreurs : '+DG.errors+'</span></div>';
  if(DG.gi < DG.groups.length){
    h += '<div class="msg '+DG.msgCls+'" role="status">'+(DG.msg||'&nbsp;')+'</div><div class="terms">'+g.map((d,i)=>{ const done=DG.done.includes(d); return '<button class="term'+(done?' done':'')+(DG.sel===i?' sel':'')+'" data-a="term" data-i="'+i+'" '+(done?'disabled':'')+' aria-pressed="'+(DG.sel===i)+'">'+fm(d.t)+'</button>'; }).join("")+'</div>'+
      '<div class="defs">'+DG.order.map(d=>{ const done=DG.done.includes(d); return '<button class="def'+(done?' done':'')+(DG.bad===d?' bad':'')+'" data-a="defn" data-i="'+g.indexOf(d)+'" '+(done?'disabled':'')+'>'+(done?'<span class="tag">'+fm(d.t)+'</span><br>':'')+fm(d.d)+'</button>'; }).join("")+'</div>';
    if(g.every(d=>DG.done.includes(d))) h += '<div class="row end"><button class="btn" data-a="defnext">'+(DG.gi+1<DG.groups.length?'Série suivante →':'Terminer')+'</button></div>';
  } else {
    h += '<div class="sheet result" style="margin-top:14px"><div class="score">Bravo !</div><p>Toutes les définitions du chapitre sont retrouvées'+(DG.errors?' ('+DG.errors+' erreur'+(DG.errors>1?'s':'')+').':' sans erreur !')+'</p><div class="row" style="justify-content:center"><button class="btn" data-a="defagain">🔄 Rejouer</button><button class="btn ghost" data-a="tochap">Retour au chapitre</button></div></div>';
  }
  return h;
}
function clickTerm(i){ DG.sel = DG.sel===i ? null : i; DG.bad=null; DG.msg=""; render(); }
function clickDefn(i){
  const g=DG.groups[DG.gi];
  if(DG.sel===null){ DG.msg="Choisis d’abord un terme en haut."; DG.msgCls="bad"; render(); return; }
  if(DG.sel===i){
    DG.done.push(g[i]); DG.ok++; DG.sel=null; DG.bad=null; P.st.def++; answered(true);
    DG.msg=pick(GOOD); DG.msgCls="good";
  } else {
    DG.errors++; DG.bad=g[i]; answered(false);
    DG.msg="Ce n’est pas la définition de « "+fm(g[DG.sel].t)+" ». Relis bien !"; DG.msgCls="bad";
  }
  say(DG.msg.replace(/<[^>]+>/g,"")); save(); render();
}
function defNext(){
  DG.gi++; DG.sel=null; DG.msg=""; DG.bad=null;
  if(DG.gi<DG.groups.length) DG.order=shuffle(DG.groups[DG.gi].slice());
  else { const c=cs(DG.ch); const first=!c.def; c.def=true; addXP(first?40:15); }
  render();
}

/* =====================================================================
   GÉNÉRATEUR DE QUESTIONS (conclusions, défi, mode classe)
   ===================================================================== */
function blankOf(c){
  const a=c.v.split(" "), b=c.f.split(" ");
  let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++;
  let j=0; while(j<a.length-i && j<b.length-i && a[a.length-1-j]===b[b.length-1-j]) j++;
  let am=a.slice(i,a.length-j).join(" "), bm=b.slice(i,b.length-j).join(" "), post=a.slice(a.length-j).join(" ");
  if(!am || !bm || am.split(" ").length>6 || bm.split(" ").length>6) return null;
  const p=am.slice(-1); if(".,;:".includes(p) && bm.slice(-1)===p){ am=am.slice(0,-1); bm=bm.slice(0,-1); post=p+(post?" "+post:""); }
  return {pre:a.slice(0,i).join(" "), post, ok:am, ko:bm};
}
function concQ(ch, c, mode){
  const modes = ["vf","choose"]; if(blankOf(c)) modes.push("fill");
  if(ch.conclusions.length<2) modes.splice(modes.indexOf("choose"),1);
  mode = mode && modes.includes(mode) ? mode : pick(modes);
  const corr = '<span class="truth">'+fm(c.v)+'</span>';
  if(mode==="vf"){
    const showTrue = Math.random()<0.5;
    return {cat:"Conclusion · vrai ou faux", kind:"vf", trap:!showTrue,
      prompt:'Vrai ou faux ?<span class="stmt">'+fm(showTrue?c.v:c.f)+'</span>',
      opts:[{h:"Vrai",ok:showTrue},{h:"Faux",ok:!showTrue}],
      corr: showTrue ? "C’est vrai : "+corr : 'C’est faux. <span class="trap">'+fm(c.f)+'</span><br>Correction : '+corr};
  }
  if(mode==="fill"){
    const b=blankOf(c);
    return {cat:"Conclusion · phrase à compléter", kind:"fill",
      prompt:'Complète :<span class="stmt">'+fm(b.pre)+' <span class="blank">……</span> '+fm(b.post)+'</span>',
      opts:shuffle([{h:fm(b.ok),ok:true},{h:fm(b.ko),ok:false}]), corr:"Correction : "+corr};
  }
  const other = shuffle(ch.conclusions.filter(x=>x!==c))[0];
  return {cat:"Conclusion · bon énoncé", kind:"choose",
    prompt:"Quel énoncé est correct ?",
    opts:shuffle([{h:fm(c.v),ok:true},{h:fm(c.f),ok:false},{h:fm(other.f),ok:false}]), corr:"Correction : "+corr};
}
function defQ(ch, d){
  const others = shuffle(ch.definitions.filter(x=>x!==d)).slice(0,3);
  if(!others.length) return null;
  if(Math.random()<0.5) return {cat:"Définition", kind:"def", prompt:'Quelle est la définition de : <b>'+fm(d.t)+'</b> ?',
    opts:shuffle([{h:fm(d.d),ok:true}].concat(others.map(o=>({h:fm(o.d),ok:false})))), corr:'<b>'+fm(d.t)+'</b> : <span class="truth">'+fm(d.d)+'</span>'};
  return {cat:"Définition", kind:"def", prompt:'Quel terme correspond à cette définition ?<span class="stmt">'+fm(d.d)+'</span>',
    opts:shuffle([{h:fm(d.t),ok:true}].concat(others.map(o=>({h:fm(o.t),ok:false})))), corr:'<b>'+fm(d.t)+'</b> : <span class="truth">'+fm(d.d)+'</span>'};
}
function famQ(ch, f){
  const pool = famPool(ch), T = typesOf(ch);
  const pairs = isStd(ch) ? [["g","r"],["r","g"],["g","u"],["u","g"],["g","s"],["r","u"]] : [["g","s"],["s","g"],["g","u"],["u","r"],["r","g"],["s","u"]];
  for(const [a,b] of shuffle(pairs.slice())){
    const N = t => t.replace(/(vec|bar)\{([^}]*)\}/g,'$2');
    /* une grandeur de même symbole (ex. plusieurs relations donnant I) ne sert jamais de piège */
    const same = x => x[a]===f[a] || (isStd(ch) && "gr".includes(a) && "gr".includes(b) && x.s===f.s);
    const valid = new Set(pool.filter(same).map(x=>N(x[b])));
    const seen = new Set([N(f[b])]), dis = [];
    shuffle(pool.map(x=>x[b])).forEach(t=>{ const k=N(t); if(!valid.has(k) && !seen.has(k)){ seen.add(k); dis.push(t); } });
    dis.splice(3);
    if(dis.length<2) continue;
    const show = k => k==="g" && isStd(ch) ? '<b>'+esc(f[k])+'</b>' : '<b>'+M(f[k])+'</b>';
    let prompt;
    if(isStd(ch)){
      prompt = {gr:"Quelle relation permet de calculer : "+show("g")+" ?", rg:"La relation "+show("r")+" donne quelle grandeur ?",
        gu:"Quelle est l’unité de : "+show("g")+" ?", ug: f.u==="sans unité" ? "Laquelle de ces grandeurs est sans unité ?" : "Quelle grandeur s’exprime en "+show("u")+" ?",
        gs:"Quel est le symbole de : "+show("g")+" ?", ru:"Quelle est l’unité de la grandeur calculée par "+show("r")+" ?"}[a+b];
    } else {
      prompt = esc(T[KEYS.indexOf(a)])+" : "+show(a)+"<br>Quelle carte « "+esc(T[KEYS.indexOf(b)])+" » lui correspond ?";
    }
    const fmt = t => (b==="g" && isStd(ch)) ? esc(t) : M(t);
    return {cat: isStd(ch) ? (b==="u"||a==="u" ? "Unité" : "Relation") : "Famille", kind: (b==="u"||a==="u")?"unit":"rel",
      prompt, opts:shuffle([{h:fmt(f[b]),ok:true}].concat(dis.map(t=>({h:fmt(t),ok:false})))),
      corr:'Famille : <span class="truth">'+esc(f.g)+' — '+M(f.s)+' — '+M(f.u)+' — '+M(f.r)+'</span><br><span class="small">'+fm(f.e)+'</span>'};
  }
  return null;
}
function makeQuestions(ch, n){
  const out=[]; const nf=Math.round(n*0.3), nd=Math.round(n*0.3);
  const fams=shuffle(ch.familles.slice()), defs=shuffle(ch.definitions.slice()), concs=shuffle(ch.conclusions.slice());
  let fi=0, di=0, ci=0;
  const tryF=()=>{ while(fi<fams.length*3){ const q=famQ(ch, fams[fi++%fams.length]); if(q) return q; } return null; };
  const tryD=()=>{ if(di>=defs.length*2) return null; return defQ(ch, defs[di++%defs.length]); };
  const tryC=()=>{ if(ci>=concs.length*2) return null; return concQ(ch, concs[ci++%concs.length]); };
  for(let k=0;k<nf;k++){ const q=tryF(); if(q) out.push(q); }
  for(let k=0;k<nd;k++){ const q=tryD(); if(q) out.push(q); }
  let guard=0; while(out.length<n && guard++<200){ const q=tryC(); if(q) out.push(q); else { const q2=tryD()||tryF(); if(q2) out.push(q2); else break; } }
  return shuffle(out).slice(0,n);
}
function qHTML(q, st, big){
  let h = '<div class="qtext">'+q.prompt+'</div><div class="opts'+(q.kind==="vf"?' vf':'')+'">'+
    q.opts.map((o,i)=>{ let cls=""; if(st.answered!=null){ if(o.ok) cls=" ok"; else if(i===st.answered) cls=" ko"; } return '<button class="opt'+cls+'" data-a="ans" data-i="'+i+'" '+(st.answered!=null?'disabled':'')+'>'+o.h+'</button>'; }).join("")+'</div>';
  if(st.answered!=null){ const ok=q.opts[st.answered] && q.opts[st.answered].ok; h += '<div class="corr '+(ok?'good':'')+'" role="status"><div class="h">'+(st.timeout?"⏰ Temps écoulé !":ok?pick(GOOD):pick(BAD))+'</div>'+q.corr+'</div>'; }
  return h;
}

let CG=null;
function newConc(ch){ CG={ch:ch.id, qs:shuffle(ch.conclusions.slice()).map(c=>concQ(ch,c)), i:0, answered:null, score:0, errs:[]}; }
function vConc(){
  const ch=CH[view.ch]; if(!CG || CG.ch!==ch.id) newConc(ch);
  let h='<h2>🕵 Conclusions</h2><p class="lead" style="margin-top:0">Lois et résultats du chapitre : attention aux pièges !</p>';
  if(CG.i<CG.qs.length){
    const q=CG.qs[CG.i];
    h += '<div class="qhead"><span class="qnum">'+(CG.i+1)+' / '+CG.qs.length+'</span><span class="qcat">'+q.cat+'</span><div class="pbar"><i style="width:'+Math.round(100*CG.i/CG.qs.length)+'%"></i></div></div>'+
      '<div class="sheet">'+qHTML(q, CG)+'</div>';
    if(CG.answered!=null) h += '<div class="row end" style="margin-top:12px"><button class="btn" data-a="concnext">'+(CG.i+1<CG.qs.length?'Suivant →':'Voir le bilan')+'</button></div>';
  } else h += resultHTML(CG.score, CG.qs.length, CG.errs, "concagain");
  return h;
}
function resultHTML(score, total, errs, again){
  const r=score/total; const msg = r===1?"Parfait, rien ne t’échappe !": r>=0.7?"Très bien, continue comme ça !": r>=0.4?"C’est un bon début : relis la fiche et réessaie.":"Lis la fiche du chapitre, puis retente ta chance !";
  return '<div class="sheet result"><div class="score">'+score+' / '+total+'</div><p class="note-red">'+msg+'</p>'+
    (errs.length?'<h3 style="text-align:left">Tes erreurs et leurs corrections</h3><div class="errs">'+errs.map(e=>'<div class="err"><div class="q">'+e.q.prompt+'</div><div>Ta réponse : <span class="your">'+e.your+'</span></div><div>Bonne réponse : <span class="good">'+e.good+'</span></div><div class="small" style="margin-top:4px">'+e.q.corr+'</div></div>').join("")+'</div>':'')+
    '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-a="'+again+'">🔄 Rejouer</button><button class="btn ghost" data-a="fiche">📄 Lire la fiche</button><button class="btn ghost" data-a="tochap">Retour au chapitre</button></div></div>';
}
function answerQ(G, i){
  if(G.answered!=null) return;
  const q=G.qs[G.i]; G.answered=i; const ok=q.opts[i].ok;
  if(ok){ G.score++; if(q.kind==="vf" && q.trap) P.st.trap++; if(q.kind==="unit") P.st.unit++; if(q.kind==="def") P.st.def++; }
  else G.errs.push({q, your:q.opts[i].h, good:q.opts.find(o=>o.ok).h});
  answered(ok); say(ok?"Bonne réponse":"Mauvaise réponse");
}

function watchRead(){
  const btn=$("#readbtn"); if(!btn) return;

  const io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ setTimeout(()=>{ if(btn.isConnected) btn.disabled=false; }, 1200); io.disconnect(); } }); });
  io.observe($("#readzone"));
}

    case "fam": FG=null; go({name:"fam", ch}); break;
    case "card": clickCard(+b.dataset.id); break;
    case "famagain": newFamRound(CH[ch]); render(); break;
    case "def": DG=null; go({name:"def", ch}); break;
    case "term": clickTerm(+b.dataset.i); break;
    case "defn": clickDefn(+b.dataset.i); break;
    case "defnext": defNext(); break;
    case "defagain": newDef(CH[ch]); render(); break;
    case "conc": CG=null; go({name:"conc", ch}); break;
    case "concagain": newConc(CH[ch]); render(); break;
    case "concnext": CG.i++; CG.answered=null; if(CG.i>=CG.qs.length){ const c=cs(ch); const first=!c.conc; c.conc=true; addXP(first?40:15); } render(); break;
    case "defi": XG=null; if(view.name==="fiche"||view.name==="conc") { view={name:"defi", ch}; render(); window.scrollTo(0,0); } else go({name:"defi", ch}); break;
    case "defiagain": newDefi(CH[ch]); render(); break;
    case "definext": XG.i++; XG.answered=null; if(XG.i>=XG.qs.length){ const c=cs(ch); c.defi=Math.max(c.defi||0, XG.score); if(XG.score===10) P.st.perfect++; addXP(XG.score*3+(XG.score>=7?20:0)); } render(); break;
    case "ans":
      if(view.name==="conc") answerQ(CG,+b.dataset.i);
      else if(view.name==="defi") answerQ(XG,+b.dataset.i);
      else if(view.name==="classe") { kAnswer(+b.dataset.i); break; }
      save(); render(); break;
    case "fiche": if(view.name==="defi"||view.name==="conc"){ view={name:"fiche", ch}; render(); window.scrollTo(0,0); } else go({name:"fiche", ch}); break;
    case "read": { const c=cs(ch); if(!c.fiche){ c.fiche=true; P.st.read++; addXP(25); toast("📄 Fiche lue !"); } save(); render(); break; }
    case "classe": KG=null; go({name:"classe", ch}); break;
    case "kstart": kStart(); break;
    case "kfull": try{ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }catch(err){} break;
    case "knext": kNext(); break;
    case "kagain": KG.stage="setup"; render(); break;
    case "reset": b.outerHTML='<span class="note-red">Sûr·e ? Tout sera effacé.</span> <button class="btn red" data-a="reset2">Oui, tout effacer</button> <button class="btn ghost" data-a="badges-r">Annuler</button>'; break;
    case "reset2": P=fresh(); save(); stack.length=0; go({name:"home"}, false); toast("Progression effacée"); break;
    case "badges-r": render(); break;
    case "install": if(installEvt){ const ev=installEvt; installEvt=null; try{ ev.prompt(); ev.userChoice.then(()=>render(), ()=>render()); }catch(err){ render(); } } break;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && view.name!=="home") back();
});

/* ---------- application installable (Android, Windows) ---------- */
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; if(view.name==="home") render(); });
window.addEventListener("appinstalled", ()=>{ installEvt=null; toast("📲 Application installée !"); if(view.name==="home") render(); });
try{ if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(err){ /* pas de mode hors ligne : l’application marche quand même */ }

/* démarrage */
render();
})();
</script>
